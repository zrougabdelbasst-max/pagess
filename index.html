    .container {

    h1 {

      transition:

        box-shadow 0.25s ease,
        filter 0.25s ease;
    }

    .social-link:hover {
      transform: translateY(-3px);

      box-shadow:

      filter: brightness(1.06);
    }

      transform: scale(0.98);

    }

      right: 18px;

      align-items: center;

    }

    .arrow {

    }

</head>
