<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>زروق للحج والعمرة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7f6, #e8f1ec);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 25px;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .logo {
      width: 180px;
      max-width: 100%;
      margin-bottom: 20px;
      border-radius: 15px;
    }

    h1 {
      margin: 10px 0;
      color: #176b45;
      font-size: 28px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    .social-link {
      display: block;
      text-decoration: none;
      color: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .social-link:hover {
      transform: scale(1.03);
    }

    .facebook {
      background: #1877f2;
    }

    .instagram {
      background: #d62976;
    }

    .tiktok {
      background: #111111;
    }

    .whatsapp {
      background: #25d366;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ضع هنا اسم صورة الشعار -->
    <img src="photo_5812355198909878770_y.jpg"
         alt="شعار زروق للحج والعمرة"
         class="logo">

    <h1>زروق للحج والعمرة</h1>

    <p>نسعد بخدمتكم في رحلتكم إلى بيت الله الحرام 🤍</p>

    <!-- غيّر الروابط لاحقًا -->
    <a class="social-link facebook" href="#" target="_blank">
      🔵 فيسبوك
    </a>

    <a class="social-link instagram" href="#" target="_blank">
      📸 إنستغرام
    </a>

    <a class="social-link tiktok" href="#" target="_blank">
      🎵 تيك توك
    </a>

    <a class="social-link whatsapp" href="#" target="_blank">
      🟢 واتساب
    </a>

    <div class="footer">
      زروق للحج والعمرة © 2026
    </div>

  </div>

</body>
</html>
