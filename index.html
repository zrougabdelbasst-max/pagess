<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>زروق للحج والعمرة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;

      font-family: "Cairo", sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(212, 175, 55, 0.18),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(7, 75, 55, 0.35),
          transparent 40%
        ),
        linear-gradient(
          145deg,
          #041c15,
          #0a392b,
          #041d16
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }


    /* =========================
       البطاقة الرئيسية
       ========================= */

    .card {

      width: 100%;
      max-width: 560px;

      background: #ffffff;

      border-radius: 28px;

      padding: 38px 38px 25px;

      text-align: center;

      border: 1px solid rgba(197, 157, 68, 0.45);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35);

      position: relative;

      overflow: hidden;
    }


    /* الخط الذهبي في الأعلى */

    .card::before {

      content: "";

      position: absolute;

      top: 0;
      right: 0;
      left: 0;

      height: 5px;

      background:
        linear-gradient(
          90deg,
          #07523c,
          #d4af37,
          #07523c
        );
    }


    /* =========================
       الشعار
       ========================= */

    .logo {

      width: 175px;
      height: 175px;

      object-fit: contain;

      display: block;

      margin: 0 auto 18px;

      border-radius: 22px;

      filter:
        drop-shadow(
          0 8px 15px rgba(0, 0, 0, 0.15)
        );
    }


    /* =========================
       اسم الوكالة
       ========================= */

    h1 {

      color: #07523c;

      font-size: 34px;

      font-weight: 800;

      line-height: 1.4;

      margin-bottom: 8px;
    }


    /* =========================
       الوصف
       ========================= */

    .description {

      color: #77736b;

      font-size: 15px;

      font-weight: 500;

      line-height: 2;

      margin-bottom: 18px;
    }


    /* =========================
       الفاصل
       ========================= */

    .ornament {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      margin: 0 auto 25px;

      color: #c49a36;

      font-size: 13px;
    }

    .ornament::before,
    .ornament::after {

      content: "";

      width: 75px;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #c49a36
        );
    }

    .ornament::after {

      background:
        linear-gradient(
          270deg,
          transparent,
          #c49a36
        );
    }


    /* =========================
       الروابط
       ========================= */

    .links {

      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    .link {

      width: 100%;

      min-height: 64px;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      text-decoration: none;

      color: white;

      border-radius: 17px;

      font-size: 18px;

      font-weight: 700;

      padding: 15px 60px;

      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.14);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .link:hover {

      transform: translateY(-3px);

      box-shadow:
        0 12px 25px rgba(0, 0, 0, 0.20);
    }


    .link:active {

      transform: scale(0.98);
    }


    /* =========================
       الأيقونات
       ========================= */

    .link-icon {

      position: absolute;

      right: 18px;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(255, 255, 255, 0.20);

      font-size: 18px;

      font-weight: 800;
    }


    .link-arrow {

      position: absolute;

      left: 18px;

      font-size: 25px;

      opacity: 0.9;
    }


    /* =========================
       ألوان المنصات
       ========================= */

    .facebook {

      background:
        linear-gradient(
          135deg,
          #1877f2,
          #075edb
        );
    }


    .instagram {

      background:
        linear-gradient(
          135deg,
          #833ab4,
          #e1306c,
          #fd1d1d,
          #fcb045
        );
    }


    .tiktok {

      background:
        linear-gradient(
          135deg,
          #080808,
          #292929
        );
    }


    .whatsapp {

      background:
        linear-gradient(
          135deg,
          #18c45b,
          #079447
        );
    }


    /* =========================
       الفوتر
       ========================= */

    footer {

      margin-top: 28px;

      padding-top: 18px;

      border-top:
        1px solid rgba(197, 157, 68, 0.28);

      color: #99958c;

      font-size: 12px;

      line-height: 1.9;
    }


    footer strong {

      display: block;

      color: #07523c;

      font-size: 14px;

      margin-bottom: 3px;
    }


    /* =========================
       الهاتف
       ========================= */

    @media (max-width: 600px) {

      body {

        padding: 0;

        align-items: stretch;
      }


      .card {

        width: 100%;

        max-width: none;

        min-height: 100vh;

        border-radius: 0;

        border: none;

        padding:
          38px
          22px
          25px;
      }


      .logo {

        width: 165px;
        height: 165px;

        margin-bottom: 17px;
      }


      h1 {

        font-size: 30px;
      }


      .description {

        font-size: 14px;

        margin-bottom: 16px;
      }


      .link {

        min-height: 62px;

        font-size: 17px;

        border-radius: 16px;
      }
    }


    /* =========================
       الهواتف الصغيرة جدًا
       ========================= */

    @media (max-width: 380px) {

      .card {

        padding:
          30px
          17px
          22px;
      }


      .logo {

        width: 145px;
        height: 145px;
      }


      h1 {

        font-size: 27px;
      }


      .description {

        font-size: 13px;
      }


      .link {

        min-height: 59px;

        font-size: 16px;
      }


      .link-icon {

        right: 14px;

        width: 35px;
        height: 35px;
      }


      .link-arrow {

        left: 14px;
      }
    }

  </style>
</head>


<body>

      <a

        </span>

      <!-- تيك توك -->

      <a
        class="link tiktok"
        href="https://www.tiktok.com/@zrougabdelbasst"

      </a>


      <!-- واتساب -->

      <a

        <span class="link-icon">

        </span>

        <span class="link-arrow">
          ‹
        </span>

      </a>


    </div>


    <!-- التذييل -->

    <footer>

      <strong>
        زروق للحج والعمرة
      </strong>

      الصدق والأمانة أساس المعاملة

      <br>

      © 2026 جميع الحقوق محفوظة

    </footer>


  </main>

</body>

</html>
