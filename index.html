<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <title>زروق للحج والعمرة</title>

  <!-- خط عربي احترافي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Cairo", sans-serif;

      background:
        radial-gradient(circle at 20% 10%, rgba(212, 175, 55, 0.15), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(10, 78, 58, 0.35), transparent 35%),
        linear-gradient(145deg, #041b14, #0b3b2b, #061f17);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 18px;
    }

    /* البطاقة الرئيسية */
    .card {
      width: 100%;
      max-width: 430px;

      background: rgba(255, 255, 255, 0.97);

      border-radius: 26px;

      padding: 30px 20px 22px;

      text-align: center;

      box-shadow:
        0 20px 55px rgba(0, 0, 0, 0.35);

      border: 1px solid rgba(212, 175, 55, 0.45);

      position: relative;

      overflow: hidden;
    }

    /* خط ذهبي علوي */
    .card::before {
      content: "";

      position: absolute;

      top: 0;
      right: 0;
      left: 0;

      height: 4px;

      background: linear-gradient(
        90deg,
        #0b5b43,
        #d4af37,
        #0b5b43
      );
    }

    /* الشعار */
    .logo {
      width: 150px;
      height: 150px;

      object-fit: contain;

      display: block;

      margin: 5px auto 15px;

      border-radius: 22px;

      filter:
        drop-shadow(
          0 7px 12px rgba(0, 0, 0, 0.15)
        );
    }

    /* اسم الوكالة */
    h1 {
      color: #07533d;

      font-size: clamp(25px, 7vw, 32px);

      font-weight: 800;

      line-height: 1.4;

      margin-bottom: 8px;
    }

    /* الوصف */
    .description {
      color: #77746c;

      font-size: 14px;

      font-weight: 500;

      line-height: 1.9;

      margin: 0 auto 18px;

      max-width: 330px;
    }

    /* الزخرفة */
    .ornament {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin: 5px auto 22px;

      color: #c29a35;

      font-size: 12px;
    }

    .ornament::before,
    .ornament::after {
      content: "";

      width: 55px;

      height: 1px;

      background: linear-gradient(
        to left,
        transparent,
        #c29a35
      );
    }

    .ornament::after {
      background: linear-gradient(
        to right,
        transparent,
        #c29a35
      );
    }

    /* الأزرار */
    .links {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .link {
      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      border-radius: 15px;

      text-decoration: none;

      color: #ffffff;

      font-size: 16px;

      font-weight: 700;

      padding: 14px 50px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

      box-shadow:
        0 6px 15px rgba(0, 0, 0, 0.13);
    }

    .link:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.20);
    }

    .link:active {
      transform: scale(0.98);
    }

    /* الأيقونات */
    .link-icon {
      position: absolute;

      right: 15px;

      width: 34px;
      height: 34px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(255, 255, 255, 0.18);

      font-size: 16px;

      font-weight: 800;
    }

    .link-arrow {
      position: absolute;

      left: 17px;

      font-size: 22px;

      opacity: 0.8;
    }

    /* ألوان المنصات */
    .facebook {
      background: linear-gradient(
        135deg,
        #1877f2,
        #0b5dcc
      );
    }

    .instagram {
      background: linear-gradient(
        135deg,
        #833ab4,
        #e1306c,
        #fd1d1d,
        #fcb045
      );
    }

    .tiktok {
      background: linear-gradient(
        135deg,
        #090909,
        #272727
      );
    }

    .whatsapp {
      background: linear-gradient(
        135deg,
        #18bd5a,
        #079447
      );
    }

    /* الفوتر */
    footer {
      margin-top: 23px;

      padding-top: 17px;

      border-top: 1px solid rgba(194, 154, 53, 0.25);

      color: #99958c;

      font-size: 11px;

      line-height: 1.8;
    }

    footer strong {
      display: block;

      color: #07533d;

      font-size: 13px;

      margin-bottom: 2px;
    }

    /* شاشات الهاتف الصغيرة */
    @media (max-width: 360px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 25px 16px 18px;

        border-radius: 22px;
      }

      .logo {
        width: 125px;
        height: 125px;
      }

      h1 {
        font-size: 24px;
      }

      .description {
        font-size: 13px;
      }

      .link {
        min-height: 54px;

        font-size: 15px;
      }
    }

  </style>
</head>
